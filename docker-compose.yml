# Demo deployment stack. Not a production posture - see README.md,
# "Deployment status".
#
# Everything the browser and the server need to agree on is derived from one
# variable:
#
#   WEB_PUBLIC_HOST   host or IP the browser will use   (default: localhost)
#   WEB_PUBLIC_PORT   host port the web app is on       (default: 8099)
#   API_PUBLIC_PORT   host port the server is on        (default: 2567)
#
#   WEB_PUBLIC_HOST=203.0.113.10 docker compose up --build
#
# They used to be three independently hardcoded values, and they had drifted:
# the web image was built against a hardcoded public IP while the server still
# allowed only `http://localhost:3000` as a CORS origin, so every request from
# the deployed app was blocked. Deriving all three from one host means that
# cannot silently recur.
#
# AUTH_COOKIE_SECURE is pinned to `false` because this stack serves plain HTTP.
# The server otherwise turns `Secure` on whenever NODE_ENV=production, which the
# runtime image sets - and a `Secure` cookie over HTTP is silently dropped by the
# browser, which makes login appear to succeed and then not work at all. Put TLS
# in front of this and set it back to `true`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dnd_web
      POSTGRES_PASSWORD: dnd_web_password
      POSTGRES_USER: dnd_web
      # Persian character data depends on this end to end, and
      # `@dnd/db check:readiness` verifies it.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dnd_web -d dnd_web']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - |
        for migration in /migrations/*.sql; do
          echo "Applying $$migration"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$migration"
        done
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dnd_web:dnd_web_password@db:5432/dnd_web
    restart: 'no'
    volumes:
      - ./packages/db/migrations:/migrations:ro

  server:
    build:
      context: .
    command: ['pnpm', '--filter', '@dnd/server', 'run', 'serve']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dnd_web:dnd_web_password@db:5432/dnd_web
      CHARACTER_PORTRAIT_STORAGE_DIR: /app/data/character-portraits
      SERVER_HOST: 0.0.0.0
      SERVER_PERSISTENCE_MODE: db
      SERVER_PORT: 2567
      # The CORS allowlist. Must be the origin the browser actually sends, which
      # is the web app's published host and port - not the container's.
      NEXT_PUBLIC_APP_URL: http://${WEB_PUBLIC_HOST:-localhost}:${WEB_PUBLIC_PORT:-8099}
      AUTH_COOKIE_SECURE: 'false'
    ports:
      - '${API_PUBLIC_PORT:-2567}:2567'
    restart: unless-stopped
    volumes:
      - character-portrait-uploads:/app/data/character-portraits

  web:
    build:
      args:
        # Baked into the client bundle at build time, so changing the host
        # requires a rebuild, not just a restart.
        NEXT_PUBLIC_SERVER_URL: http://${WEB_PUBLIC_HOST:-localhost}:${API_PUBLIC_PORT:-2567}
      context: .
    command: ['pnpm', '--filter', '@dnd/web', 'start']
    depends_on:
      server:
        condition: service_started
    environment:
      NEXT_PUBLIC_SERVER_URL: http://${WEB_PUBLIC_HOST:-localhost}:${API_PUBLIC_PORT:-2567}
      PORT: 3000
    ports:
      - '${WEB_PUBLIC_PORT:-8099}:3000'
    restart: unless-stopped

volumes:
  character-portrait-uploads:
  postgres-data:
