services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dnd_web
      POSTGRES_PASSWORD: dnd_web_password
      POSTGRES_USER: dnd_web
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dnd_web -d dnd_web']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    command:
      - sh
      - -c
      - |
        for migration in /migrations/*.sql; do
          echo "Applying $$migration"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$migration"
        done
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dnd_web:dnd_web_password@db:5432/dnd_web
    restart: 'no'
    volumes:
      - ./packages/db/migrations:/migrations:ro

  server:
    build:
      context: .
    command: ['pnpm', '--filter', '@dnd/server', 'run', 'serve']
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dnd_web:dnd_web_password@db:5432/dnd_web
      CHARACTER_PORTRAIT_STORAGE_DIR: /app/data/character-portraits
      SERVER_HOST: 0.0.0.0
      SERVER_PERSISTENCE_MODE: db
      SERVER_PORT: 2567
    ports:
      - '2567:2567'
    restart: unless-stopped
    volumes:
      - character-portrait-uploads:/app/data/character-portraits

  web:
    build:
      args:
        NEXT_PUBLIC_SERVER_URL: http://130.185.72.72:2567
      context: .
    command: ['pnpm', '--filter', '@dnd/web', 'start']
    depends_on:
      server:
        condition: service_started
    environment:
      NEXT_PUBLIC_SERVER_URL: http://130.185.72.72:2567
      PORT: 3000
    ports:
      - '8099:3000'
    restart: unless-stopped

volumes:
  character-portrait-uploads:
  postgres-data:
