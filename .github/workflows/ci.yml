name: CI

on:
  # Pull requests run regardless of target branch, so a PR into development is
  # validated exactly like a PR into main.
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Steps below run even after an earlier one fails, so a single run reports
      # every broken check instead of only the first. The job still fails if any
      # step fails. This matters most for formatting: a Windows-saved file shows
      # up as a whole-file CRLF diff, which would otherwise mask real failures
      # further down the list.
      #
      # Order matches the validation sequence documented in CLAUDE.md.

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      # `next build` type-checks apps/web only. This covers the server and every
      # package, and it is the sole enforcement of the i18n parity rule: because
      # `type Messages = typeof messages.en`, a key added to `en` without a `fa`
      # counterpart is a type error and nothing else catches it. Tests run
      # through tsx, which strips types rather than checking them.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      # Catches build-time failures that typecheck cannot see, such as invalid
      # server/client component boundaries or bad static generation.
      - name: Build web
        if: ${{ !cancelled() }}
        run: pnpm --filter @dnd/web build

  # The browser harnesses are the only automated evidence that the product loop
  # actually works: they start real server and web processes and drive headless
  # Chrome through session setup, placement, an encounter, and recovery. Unit
  # tests cannot catch a cockpit that renders but cannot be operated.
  #
  # A separate job because these are slow and need a browser, so a fast unit
  # failure is not stuck behind them.
  #
  # The DB-mode smokes are deliberately not here. They need a provisioned,
  # migrated, UTF8-verified Postgres, and running them without that would report
  # a false pass. They stay local - see README.md.
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ubuntu-latest ships Chrome, but the harnesses look for it by name. Point
      # them at it explicitly rather than relying on auto-discovery.
      - name: Resolve Chrome
        run: echo "RUNTIME_SMOKE_BROWSER=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_ENV"

      - name: Runtime smoke
        if: ${{ !cancelled() }}
        run: pnpm --filter @dnd/web test:smoke

      - name: Two-profile runtime smoke
        if: ${{ !cancelled() }}
        run: pnpm --filter @dnd/web test:smoke:two-profile

      - name: Map builder smoke
        if: ${{ !cancelled() }}
        run: pnpm --filter @dnd/web test:smoke:map-builder

  # The one DB-mode slice CI runs, and the only automated proof that M1 state
  # survives a process it outlived. Everything else about M1 is provable in
  # memory; "does it come back" is not.
  #
  # Deliberately narrow. The browser DB smokes need Chrome as well as Postgres
  # and stay local (see README) - running every historical DB harness here would
  # buy little and cost every pull request several minutes.
  #
  # The credentials below are ephemeral and belong to a container that exists
  # for the length of this job. They are not secrets and must never be pointed
  # at anything that outlives the runner.
  m1-db-recovery:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dnd_web_ci
          POSTGRES_PASSWORD: dnd_web_ci_password
          POSTGRES_USER: dnd_web_ci
          # Persian character data is stored here; a non-UTF8 database corrupts
          # it silently, and `check:readiness` fails the job rather than let it.
          POSTGRES_INITDB_ARGS: '--encoding=UTF8'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_web_ci -d dnd_web_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://dnd_web_ci:dnd_web_ci_password@127.0.0.1:5432/dnd_web_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @dnd/db db:migrate

      # Not optional bureaucracy: it verifies UTF8 on both server and client and
      # round-trips a Persian string, which is the failure this repo has already
      # been through once.
      - name: Verify database readiness
        run: pnpm --filter @dnd/db check:readiness

      - name: M1 persistence tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @dnd/server test:db

      # Provisions its own database per run, starts and kills a real server
      # process, then starts a second one against the same data. A failure here
      # means recovery is broken, which is the whole point of the job.
      - name: M1 DB restart recovery smoke
        if: ${{ !cancelled() }}
        run: pnpm --filter @dnd/server test:smoke:m1-db-restart

      - name: Capture PostgreSQL logs on failure
        if: ${{ failure() }}
        run: docker logs "$(docker ps -aqf ancestor=postgres:16-alpine)" 2>&1 | tail -200
