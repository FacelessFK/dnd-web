# Local development database only.
#
# `docker-compose.yml` is the full deployment stack: it builds the server and
# web images and does not publish a host port for Postgres. Local DB-mode work
# runs the server and web as ordinary node processes, so it needs a Postgres
# reachable from the host instead.
#
# This file starts just the database on host port 55432 - matching the local
# `.env` DATABASE_URL and the port the delivery docs record - so it never
# collides with a system Postgres on 5432. Credentials match
# `docker-compose.yml` so both stacks describe the same database.
#
#   docker compose -f docker-compose.dev.yml up -d      # start db + migrations
#   corepack pnpm --filter @dnd/db check:readiness      # verify
#   docker compose -f docker-compose.dev.yml down       # stop (keeps data)
#
# The `migrate` service applies packages/db/migrations/ in numeric order and
# exits. Migrations are plain CREATE TABLE IF NOT EXISTS style, so re-running
# `up` is safe.
#
# Image note: `docker-compose.yml` uses postgres:16-alpine. This dev file pins
# postgres:15.7-alpine because that image is already present locally and Docker
# Hub pulls are unreliable from this network. The migrations are plain SQL with
# no version-specific syntax, so 15 and 16 behave identically here. If you can
# pull images, bumping both files to the same tag is preferable.

services:
  db:
    image: postgres:15.7-alpine
    container_name: dnd-web-dev-db
    environment:
      POSTGRES_DB: dnd_web
      POSTGRES_PASSWORD: dnd_web_password
      POSTGRES_USER: dnd_web
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dnd_web -d dnd_web']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '127.0.0.1:55432:5432'
    restart: unless-stopped
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  migrate:
    image: postgres:15.7-alpine
    command:
      - sh
      - -c
      - |
        for migration in /migrations/*.sql; do
          echo "Applying $$migration"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$migration"
        done
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dnd_web:dnd_web_password@db:5432/dnd_web
    restart: 'no'
    volumes:
      - ./packages/db/migrations:/migrations:ro

volumes:
  postgres-dev-data:
